services:
  finder:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      - ./data:/app/data
    command: ["/app/.venv/bin/python", "-m", "fansub_finder", "serve", "--host", "0.0.0.0", "--port", "18765", "--config", "/app/data/config.json"]
    environment:
      # Set to an address reachable FROM the container when a proxy is needed.
      # Example with Docker Desktop: http://host.docker.internal:7897
      FANSUB_PROXY: ${FANSUB_PROXY:-}
