name: Build and deploy read-only monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FANSUB_PROXY: ''
      FANSUB_DATA_DIR: data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - uses: actions/cache@v4
        with:
          path: data
          key: monitor-data-${{ github.run_id }}
          restore-keys: monitor-data-
      - run: uv run --no-sync python -m fansub_finder.pages_export --config config.example.json --scan --output dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
